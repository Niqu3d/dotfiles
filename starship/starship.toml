format = '''
$username$hostname$directory$localip$os$fill
$character'''

right_format = '$cmd_duration$git_branch$git_status$time'

[fill]
symbol = " "

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[directory]
style = "cyan"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = '󰌾'
read_only_style = 'red'

[git_branch]
format = "[$branch]($style)"
style = "bright-black"
symbol = " "

[git_status]
format = "($ahead_behind) $stashed ($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[username]
style_user = 'white bold'
style_root = 'black bold'
format = '[$user]($style) '
disabled = false
show_always = true

[hostname]
ssh_only = false
format = '[$ssh_symbol](bold green) on [$hostname](bold blue) '
trim_at = '.companyname.com'
disabled = false
ssh_symbol = " "

[localip]
ssh_only = true
format = '@[$localipv4](bold red) '
disabled = false

[os]
format = '[$symbol]($style)'
style = "bold blue"
disabled = false

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
symbol = " "

[time]
disabled = false
style = 'black'
format = '[  $time ]($style) '
use_12hr = true



